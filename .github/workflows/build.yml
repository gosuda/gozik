name: Build

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: 37 5 * * 1

jobs:
  build-linux:
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"platform":"linux/amd64","output":"gozik-linux-amd64","arch":"amd64","cc":"gcc","cc-target":"x86_64-linux-gnu"},{"platform":"linux/arm64","output":"gozik-linux-arm64","arch":"arm64","cc":"aarch64-linux-gnu-gcc","cc-target":"aarch64-linux-gnu"},{"platform":"linux/riscv64","output":"gozik-linux-riscv64","arch":"riscv64","cc":"riscv64-linux-gnu-gcc","cc-target":"riscv64-linux-gnu"}]' || '[{"platform":"linux/amd64","output":"gozik-linux-amd64","arch":"amd64","cc":"gcc","cc-target":"x86_64-linux-gnu"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - name: Install native dependencies (amd64)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libopusfile-dev libasound2-dev
      - name: Install cross dependencies (${{ matrix.arch }})
        if: matrix.arch != 'amd64'
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}
          CODENAME=$(lsb_release -c -s)
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.bak || true
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.bak || true
          fi
          cat <<EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse

          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME} main restricted universe multiverse
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-updates main restricted universe multiverse
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-backports main restricted universe multiverse
          deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cc-target }} libgtk-3-dev:${{ matrix.arch }} libopusfile-dev:${{ matrix.arch }} libasound2-dev:${{ matrix.arch }}
      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
          PKG_CONFIG_LIBDIR: /usr/lib/${{ matrix.cc-target }}/pkgconfig:/usr/share/pkgconfig
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}


  build-windows:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: depot-windows-2025-4
            msystem: MINGW64
            mingw-prefix: mingw64
            cc: gcc
            output: gozik-windows-amd64.exe
            msys2-packages: >-
              mingw-w64-x86_64-toolchain
              mingw-w64-x86_64-gtk3
              mingw-w64-x86_64-opusfile
              mingw-w64-x86_64-pkg-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: false
          path-type: inherit
          install: ${{ matrix.msys2-packages }}
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="/${{ matrix.mingw-prefix }}/bin:$PATH"
          export CC="${{ matrix.cc }}"
          export CGO_ENABLED=1
          export CGO_CFLAGS="-Wno-dll-attribute-on-redeclaration"
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-macos-latest
            arch: arm64
            output: gozik-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - name: Install dependencies
        run: |
          brew install gtk+3 pkg-config opus opusfile
      - name: Build
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
